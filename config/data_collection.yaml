data_collection:
  ros__parameters:
    # Output bag: {save_dir}/{name}/  (rosbag2 db3 format)
    # Topics written: 'scan' (LaserScan), 'drive' (AckermannDriveStamped)
    name:     'porto_human_ccw_18hz'
    save_dir: '/home/autodrive_devkit/src/tln_variants/train/dataset'

    # Stop automatically after this many samples (CTRL+C also works)
    max_samples: 5000

    # Topics
    scan_topic:     '/autodrive/roboracer_1/lidar'
    steer_topic:    '/autodrive/roboracer_1/steering_command'
    throttle_topic: '/autodrive/roboracer_1/throttle_command'
    odom_topic:     '/autodrive/roboracer_1/odom'

    # Synchroniser tolerance in ms (lidar + commands arrive at ~40 Hz)
    sync_tolerance_ms: 55.0

    # Skip frames when the car is stationary
    record_only_when_moving: true
    min_speed_threshold: 0.01
